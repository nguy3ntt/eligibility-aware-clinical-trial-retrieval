name: research-checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: research_ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: research_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U research_ci -d research_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports: ["6333:6333"]
    env:
      DATABASE_URL: postgresql+psycopg://research_ci:isolated-ci-only@127.0.0.1:5432/research_ci
      RUN_POSTGRES_TESTS: "1"
      QDRANT_TEST_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install
        run: python -m pip install -r requirements/ci.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test
        run: pytest --junitxml=evaluation/reports/ci-tests.xml
      - name: Compile
        run: python -m compileall backend pipelines evaluation
      - name: Validate Compose
        run: docker compose -f infrastructure/compose.yaml config --quiet

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - name: Offline browser checks with invented fixtures
        run: npm run test:e2e
